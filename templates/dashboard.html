<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.site_title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
        }
        header {
            background: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .title-box {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: white;
            padding: 10px 20px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(37,99,235,0.3);
        }
        .logout-btn {
            background: #f1f5f9;
            color: #64748b;
            padding: 10px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }
        .card h2 {
            font-size: 17px;
            margin-bottom: 14px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .select-region {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            background: #f8fafc;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }
        .select-region:focus { border-color: #2563eb; }
        .input-field, .uid-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
        }
        .input-field:focus, .uid-input:focus { border-color: #2563eb; background: white; }
        .uid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .category-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab {
            flex: 1;
            min-width: 90px;
            padding: 10px;
            background: #f1f5f9;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab.active { background: #2563eb; color: white; }
        .emote-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .emote-item {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
        }
        .emote-item.selected { border-color: #2563eb; background: #eff6ff; }
        .emote-item img { width: 76px; height: 76px; object-fit: cover; border-radius: 12px; margin-bottom: 6px; }
        .send-btn {
            display: none;
        }
        .toast {
            position: fixed;
            top: 80px;
            right: 16px;
            z-index: 9999;
            min-width: 220px;
            max-width: 320px;
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: none;
            animation: slideIn 0.3s ease;
        }
        .toast.success {
            background: #16a34a;
            color: white;
        }
        .toast.error {
            background: #dc2626;
            color: white;
        }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .hidden { display: none !important; }
        .hidden { display: none; }
        footer { text-align: center; padding: 20px; color: #64748b; font-size: 13px; }
        @media (max-width: 480px) {
            .uid-grid, .emote-grid { grid-template-columns: 1fr 1fr; }
            .title-box { font-size: 15px; padding: 8px 14px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="title-box">{{ settings.site_title }}</div>
        <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </header>

    <main>
        <section class="card">
            <h2><i class="fas fa-globe"></i> Select Region</h2>
            <select id="regionSelect" class="select-region">
                {% for s in servers %}
                <option value="{{ s.name }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </section>

        <section class="card">
            <h2><i class="fas fa-key"></i> Team Code</h2>
            <input type="text" id="teamCode" placeholder="Enter Team Code" class="input-field">
        </section>

        <section class="card">
            <h2><i class="fas fa-users"></i> Target UIDs</h2>
            <div class="uid-grid">
                <input type="text" class="uid-input" placeholder="UID 1 (Optional)" maxlength="10">
                <input type="text" class="uid-input" placeholder="UID 2 (Optional)" maxlength="10">
                <input type="text" class="uid-input" placeholder="UID 3 (Optional)" maxlength="10">
                <input type="text" class="uid-input" placeholder="UID 4 (Optional)" maxlength="10">
            </div>
        </section>

        <section class="card">
            <h2><i class="fas fa-smile"></i> Send Emotes</h2>
            <div class="category-tabs" id="categoryTabs"></div>
            <div id="emoteGrid" class="emote-grid"></div>
            <button id="sendBtn" class="send-btn"><i class="fas fa-paper-plane"></i> SEND EMOTE</button>
        </section>

        <div id="toast" class="toast"></div>
    </main>

    <footer>Premium Emote Sender • {{ settings.site_title }}</footer>

    <script>
        const EMOTES = {{ emotes | tojson }};
        let selectedEmoteId = null;

        const categories = [...new Set(EMOTES.map(e => e.category))];
        const tabsEl = document.getElementById("categoryTabs");
        categories.forEach((cat, i) => {
            const btn = document.createElement("button");
            btn.className = "tab" + (i === 0 ? " active" : "");
            btn.textContent = cat;
            btn.onclick = () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                btn.classList.add("active");
                renderEmotes(cat);
            };
            tabsEl.appendChild(btn);
        });

        function renderEmotes(category) {
            const grid = document.getElementById("emoteGrid");
            grid.innerHTML = "";
            EMOTES.filter(e => e.category === category).forEach(emote => {
                const div = document.createElement("div");
                div.className = "emote-item";
                div.innerHTML = `
                    <img src="${emote.image}" alt="${emote.name}" onerror="this.src='https://via.placeholder.com/76?text=Emote'">
                    <div style="font-weight:600;font-size:13px">${emote.name}</div>
                    <small style="color:#64748b">ID: ${emote.emote_id}</small>
                `;
                div.onclick = () => {
                    document.querySelectorAll(".emote-item").forEach(el => el.classList.remove("selected"));
                    div.classList.add("selected");
                    selectedEmoteId = emote.emote_id;
                    sendEmote(); // Directly send on click
                };
                grid.appendChild(div);
            });
        }
        if (categories.length) renderEmotes(categories[0]);

        async function sendEmote() {
            const teamCode = document.getElementById("teamCode").value.trim();
            const region = document.getElementById("regionSelect").value;
            const uidInputs = Array.from(document.querySelectorAll(".uid-input"));
            const uids = uidInputs.map(i => i.value.trim()).filter(Boolean);

            if (!teamCode) return showResult("Please enter Team Code first.", true);
            if (!selectedEmoteId) return showResult("Please select an Emote.", true);

            for (let uid of uids) {
                if (!/^\d{10}$/.test(uid)) {
                    return showResult("UID must be exactly 10 digits.", true);
                }
            }

            try {
                const res = await fetch("/api/send", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ team_code: teamCode, emote_id: selectedEmoteId, server_name: region, uids })
                });
                const data = await res.json();
                if (data.success) {
                    showResult("Emote Sent", false);
                } else {
                    showResult(data.error || "Failed to send emote", true);
                }
            } catch (e) {
                showResult("Network Error", true);
            }
        }

        function showResult(msg, error) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.classList.remove("hidden", "error", "success");
            toast.classList.add(error ? "error" : "success");
            toast.style.display = "block";

            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.style.display = "none";
            }, 3500);
        }
    </script>
</body>
</html>
